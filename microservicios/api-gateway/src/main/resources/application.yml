server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Microservicio de Inventario
        - id: ms-inventory
          uri: lb://ms-inventory
          predicates:
            - Path=/api/v1/tools/**, /api/v1/categories/**, /api/v1/tool-instances/**
          filters:
            - StripPrefix=0

        # Microservicio de Préstamos
        - id: ms-loans
          uri: lb://ms-loans
          predicates:
            - Path=/api/v1/loans/**, /api/v1/damages/**
          filters:
            - StripPrefix=0

        # Microservicio de Clientes
        - id: ms-clients
          uri: lb://ms-clients
          predicates:
            - Path=/api/v1/clients/**
          filters:
            - StripPrefix=0

        # Microservicio de Tarifas
        - id: ms-rates
          uri: lb://ms-rates
          predicates:
            - Path=/api/v1/rates/**, /api/v1/fines/**
          filters:
            - StripPrefix=0

        # Microservicio de Kardex
        - id: ms-kardex
          uri: lb://ms-kardex
          predicates:
            - Path=/api/v1/kardex/**
          filters:
            - StripPrefix=0

        # Microservicio de Reportes
        - id: ms-reports
          uri: lb://ms-reports
          predicates:
            - Path=/api/v1/reports/**
          filters:
            - StripPrefix=0

        # Microservicio de Usuarios
        - id: ms-users
          uri: lb://ms-users
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"  # Permitir cualquier origen (para desarrollo)
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders:
              - "*"
            exposedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: true  # Necesario para enviar JWT tokens
            maxAge: 3600  # Cache de preflight por 1 hora

  # Configuración OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8090/realms/toolrent-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8090/realms/toolrent-realm/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true
