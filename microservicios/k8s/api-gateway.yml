apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: toolrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: brandonusach/toolrent-api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: EUREKA_URL
          value: "http://eureka-server:8761/eureka/"
        - name: KEYCLOAK_ISSUER_URI
          value: "http://keycloak:8090/realms/toolrent-realm"
        - name: KEYCLOAK_JWK_SET_URI
          value: "http://keycloak:8090/realms/toolrent-realm/protocol/openid-connect/certs"
        resources:
          requests:
            memory: "128Mi"
            cpu: "10m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: toolrent
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP

