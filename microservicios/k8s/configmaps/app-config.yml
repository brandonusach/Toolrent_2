apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: toolrent
data:
  # URLs de servicios
  EUREKA_URL: "http://eureka-server:8761/eureka/"
  CONFIG_SERVER_URL: "http://config-server:8888"
  # Keycloak corriendo localmente en host (no en K8s)
  KEYCLOAK_ISSUER_URI: "http://host.minikube.internal:8090/realms/toolrent-realm"
  KEYCLOAK_JWK_SET_URI: "http://host.minikube.internal:8090/realms/toolrent-realm/protocol/openid-connect/certs"

  # Configuración de bases de datos (hosts y puertos)
  DB_PORT: "5432"

